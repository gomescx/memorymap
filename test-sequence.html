<!DOCTYPE html>
<html>
<head>
    <title>Sequence Number Test</title>
    <script src="jsmind/es6/jsmind.js"></script>
    <link rel="stylesheet" type="text/css" href="jsmind/style/jsmind.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #controls { margin-bottom: 20px; }
        button { margin: 5px; padding: 8px 12px; }
        #debug-output { 
            background: #f5f5f5; 
            padding: 10px; 
            margin-top: 20px; 
            border: 1px solid #ddd;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .metadata { 
            font-size: 10px; 
            color: #666; 
            border-top: 1px solid #ccc; 
            padding-top: 2px; 
        }
    </style>
</head>
<body>
    <h1>Sequence Number Generation Test</h1>
    
    <div id="controls">
        <button onclick="runFullTest()">Run Full Test</button>
        <button onclick="addRandomChild()">Add Random Child</button>
        <button onclick="checkAllSequences()">Check All Sequences</button>
        <button onclick="updateAllSequenceNumbers()">Update Sequences</button>
        <button onclick="toggleMetadataDisplay()">Toggle Metadata Display</button>
        <button onclick="clearDebug()">Clear Debug</button>
    </div>

    <div id="jsmind_container" style="width: 100%; height: 400px; border: 1px solid #ccc;"></div>
    
    <div id="debug-output"></div>

    <script>
        var jm;
        var debugOutput = document.getElementById('debug-output');
        var showMetadata = false;

        function log(message) {
            console.log(message);
            debugOutput.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
            debugOutput.scrollTop = debugOutput.scrollHeight;
        }

        function clearDebug() {
            debugOutput.textContent = '';
        }

        // Initialize mind map
        function initMindMap() {
            var mind = {
                meta: { name: 'Test', author: 'Test', version: '1.0' },
                format: 'node_array',
                data: [
                    { id: 'root', isroot: true, topic: 'Root Node' },
                    { id: 'child1', parentid: 'root', topic: 'Child 1' },
                    { id: 'child2', parentid: 'root', topic: 'Child 2' },
                    { id: 'child3', parentid: 'root', topic: 'Child 3' },
                    { id: 'grandchild1_1', parentid: 'child1', topic: 'Grandchild 1.1' },
                    { id: 'grandchild1_2', parentid: 'child1', topic: 'Grandchild 1.2' },
                    { id: 'grandchild2_1', parentid: 'child2', topic: 'Grandchild 2.1' },
                    { id: 'greatgrand1_1_1', parentid: 'grandchild1_1', topic: 'Great-grandchild 1.1.1' }
                ]
            };

            var options = {
                container: 'jsmind_container',
                theme: 'primary',
                editable: true
            };

            jm = new jsMind(options);
            jm.show(mind);
            
            log('Mind map initialized');
            return jm;
        }

        // Core sequence functions (copied from pilot-mindmap.html)
        function setNodeSequence(node, sequence) {
            if (!node.data) {
                node.data = {};
            }
            node.data.sequence = sequence;
            log('Set sequence "' + sequence + '" for node "' + node.topic + '" (ID: ' + node.id + ')');
        }

        function updateAllSequenceNumbers() {
            log('=== STARTING SEQUENCE UPDATE ===');
            var rootNode = jm.get_node('root');
            if (!rootNode) {
                log('ERROR: No root node found');
                return;
            }

            log('Root node found: ' + rootNode.topic);
            setNodeSequence(rootNode, '');
            
            if (rootNode.children && rootNode.children.length > 0) {
                log('Root has ' + rootNode.children.length + ' children: ' + rootNode.children.join(', '));
                updateChildrenSequences(rootNode, '');
            } else {
                log('Root has no children');
            }
            
            log('=== SEQUENCE UPDATE COMPLETE ===');
        }

        function updateChildrenSequences(parentNode, parentSequence) {
            if (!parentNode.children || parentNode.children.length === 0) {
                log('No children for ' + parentNode.topic);
                return;
            }

            log('Updating children of "' + parentNode.topic + '" (parent sequence: "' + parentSequence + '")');
            
            for (var i = 0; i < parentNode.children.length; i++) {
                var childId = parentNode.children[i];
                var childNode = jm.get_node(childId);
                
                if (childNode) {
                    var sequenceNumber;
                    if (parentSequence === '') {
                        sequenceNumber = (i + 1).toString();
                    } else {
                        sequenceNumber = parentSequence + '.' + (i + 1).toString();
                    }
                    
                    log('  Child ' + (i + 1) + ': "' + childNode.topic + '" -> sequence "' + sequenceNumber + '"');
                    setNodeSequence(childNode, sequenceNumber);
                    
                    // Recursively update this child's children
                    updateChildrenSequences(childNode, sequenceNumber);
                } else {
                    log('ERROR: Could not find child node with ID: ' + childId);
                }
            }
        }

        function checkAllSequences() {
            log('=== CHECKING ALL SEQUENCES ===');
            var allData = jm.get_data();
            if (allData && allData.data) {
                for (var i = 0; i < allData.data.length; i++) {
                    var nodeData = allData.data[i];
                    var node = jm.get_node(nodeData.id);
                    if (node) {
                        var sequence = (node.data && node.data.sequence !== undefined) ? node.data.sequence : 'UNDEFINED';
                        log('Node "' + node.topic + '" (ID: ' + node.id + ') -> sequence: "' + sequence + '"');
                        
                        // Check parent-child relationships
                        if (node.children && node.children.length > 0) {
                            log('  Has ' + node.children.length + ' children: ' + node.children.join(', '));
                        }
                        if (node.parent) {
                            var parentNode = jm.get_node(node.parent);
                            log('  Parent: "' + (parentNode ? parentNode.topic : 'UNKNOWN') + '" (ID: ' + node.parent + ')');
                        }
                    }
                }
            }
            log('=== SEQUENCE CHECK COMPLETE ===');
        }

        function addRandomChild() {
            var allNodes = [];
            var allData = jm.get_data();
            if (allData && allData.data) {
                for (var i = 0; i < allData.data.length; i++) {
                    allNodes.push(allData.data[i].id);
                }
            }
            
            var randomParentId = allNodes[Math.floor(Math.random() * allNodes.length)];
            var newId = 'node_' + Date.now();
            var newTopic = 'New Child ' + Date.now();
            
            log('Adding new child "' + newTopic + '" to parent "' + randomParentId + '"');
            jm.add_node(randomParentId, newId, newTopic);
            
            setTimeout(function() {
                updateAllSequenceNumbers();
                if (showMetadata) {
                    toggleMetadataDisplay();
                }
            }, 100);
        }

        function toggleMetadataDisplay() {
            showMetadata = !showMetadata;
            log('Toggling metadata display: ' + (showMetadata ? 'ON' : 'OFF'));
            
            var allNodeElements = document.querySelectorAll('jmnode[nodeid]');
            
            for (var i = 0; i < allNodeElements.length; i++) {
                var nodeElement = allNodeElements[i];
                var nodeId = nodeElement.getAttribute('nodeid');
                var node = jm.get_node(nodeId);
                
                // Remove existing metadata
                var existingMetadata = nodeElement.querySelector('.metadata');
                if (existingMetadata) {
                    existingMetadata.remove();
                }
                
                if (showMetadata && node) {
                    var sequence = (node.data && node.data.sequence !== undefined) ? node.data.sequence : 'NO_SEQ';
                    var metadataDiv = document.createElement('div');
                    metadataDiv.className = 'metadata';
                    metadataDiv.textContent = '# ' + sequence;
                    nodeElement.appendChild(metadataDiv);
                }
            }
        }

        function runFullTest() {
            log('=== STARTING FULL TEST ===');
            
            // Test 1: Check initial state
            log('TEST 1: Initial state check');
            checkAllSequences();
            
            // Test 2: Update sequences
            log('TEST 2: Update sequences');
            updateAllSequenceNumbers();
            
            // Test 3: Check sequences after update
            log('TEST 3: Check sequences after update');
            checkAllSequences();
            
            // Test 4: Add a new node and check
            log('TEST 4: Add new node and recheck');
            var newId = 'test_node_' + Date.now();
            jm.add_node('child1', newId, 'Test Node');
            
            setTimeout(function() {
                updateAllSequenceNumbers();
                checkAllSequences();
                
                // Test 5: Show metadata
                log('TEST 5: Showing metadata on nodes');
                showMetadata = true;
                toggleMetadataDisplay();
                
                log('=== FULL TEST COMPLETE ===');
            }, 200);
        }

        // Initialize when page loads
        window.onload = function() {
            initMindMap();
            setTimeout(function() {
                log('Page loaded, running initial test...');
                runFullTest();
            }, 500);
        };
    </script>
</body>
</html>
