<!DOCTYPE html>
<html>
<head>
    <title>Complete Sequence Diagnosis</title>
    <script src="jsmind/es6/jsmind.js"></script>
    <link rel="stylesheet" type="text/css" href="jsmind/style/jsmind.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        button { margin: 5px; padding: 8px 12px; }
        #debug { background: #f5f5f5; padding: 10px; font-family: monospace; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
        .test-result { margin: 10px 0; padding: 10px; }
        .pass { background: #d4edda; border: 1px solid #c3e6cb; }
        .fail { background: #f8d7da; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>Complete Sequence Number Diagnosis</h1>
    
    <div class="section">
        <h2>Test Mind Map</h2>
        <div id="jsmind_container" style="width: 100%; height: 400px; border: 1px solid #ccc;"></div>
        <button onclick="runCompleteTest()">Run Complete Diagnosis</button>
        <button onclick="testSimpleMethod()">Test Simple Method</button>
        <button onclick="testComplexMethod()">Test Complex Method</button>
        <button onclick="addTestNode()">Add Test Node</button>
        <button onclick="showMetadata()">Show Metadata</button>
    </div>
    
    <div id="results"></div>
    <div id="debug"></div>

    <script>
        var jm;
        var results = document.getElementById('results');
        var debug = document.getElementById('debug');

        function log(message) {
            console.log(message);
            debug.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
            debug.scrollTop = debug.scrollHeight;
        }

        function addResult(test, passed, message) {
            var div = document.createElement('div');
            div.className = 'test-result ' + (passed ? 'pass' : 'fail');
            div.innerHTML = '<strong>' + test + ':</strong> ' + (passed ? 'PASS' : 'FAIL') + ' - ' + message;
            results.appendChild(div);
        }

        function clearResults() {
            results.innerHTML = '';
            debug.textContent = '';
        }

        // Initialize mind map
        function initMindMap() {
            var mind = {
                meta: { name: 'Test', author: 'Test', version: '1.0' },
                format: 'node_array',
                data: [
                    { id: 'root', isroot: true, topic: 'Root Node' },
                    { id: 'child1', parentid: 'root', topic: 'Child 1' },
                    { id: 'child2', parentid: 'root', topic: 'Child 2' },
                    { id: 'child3', parentid: 'root', topic: 'Child 3' },
                    { id: 'grandchild1_1', parentid: 'child1', topic: 'Grandchild 1.1' },
                    { id: 'grandchild1_2', parentid: 'child1', topic: 'Grandchild 1.2' }
                ]
            };

            var options = {
                container: 'jsmind_container',
                theme: 'primary',
                editable: true
            };

            jm = new jsMind(options);
            jm.show(mind);
            log('Mind map initialized');
        }

        // Test 1: Basic node structure
        function testNodeStructure() {
            log('=== Testing Node Structure ===');
            var rootNode = jm.get_node('root');
            
            if (!rootNode) {
                addResult('Node Structure', false, 'Root node not found');
                return false;
            }

            log('Root node: ' + rootNode.topic + ' (ID: ' + rootNode.id + ')');
            log('Root children: ' + (rootNode.children ? rootNode.children.join(', ') : 'none'));
            
            var hasChildren = rootNode.children && rootNode.children.length > 0;
            addResult('Node Structure', hasChildren, hasChildren ? rootNode.children.length + ' children found' : 'No children found');
            
            return hasChildren;
        }

        // Test 2: Simple sequence assignment
        function testSimpleSequencing() {
            log('=== Testing Simple Sequencing ===');
            
            function setNodeSequence(node, sequence) {
                if (!node.data) node.data = {};
                node.data.sequence = sequence;
                log('Set sequence "' + sequence + '" for "' + node.topic + '"');
            }

            function simpleUpdateSequences(parentNode, parentSequence) {
                if (!parentNode.children) return;
                
                for (var i = 0; i < parentNode.children.length; i++) {
                    var childId = parentNode.children[i];
                    var childNode = jm.get_node(childId);
                    
                    if (childNode) {
                        var sequence = parentSequence === '' ? 
                            (i + 1).toString() : 
                            parentSequence + '.' + (i + 1).toString();
                        
                        setNodeSequence(childNode, sequence);
                        simpleUpdateSequences(childNode, sequence);
                    }
                }
            }

            var rootNode = jm.get_node('root');
            setNodeSequence(rootNode, '');
            simpleUpdateSequences(rootNode, '');
            
            // Verify sequences
            var child1 = jm.get_node('child1');
            var child2 = jm.get_node('child2');
            var grandchild1_1 = jm.get_node('grandchild1_1');
            
            var success = true;
            var messages = [];
            
            if (!child1 || !child1.data || child1.data.sequence !== '1') {
                success = false;
                messages.push('Child1 sequence incorrect: ' + (child1 && child1.data ? child1.data.sequence : 'undefined'));
            }
            
            if (!child2 || !child2.data || child2.data.sequence !== '2') {
                success = false;
                messages.push('Child2 sequence incorrect: ' + (child2 && child2.data ? child2.data.sequence : 'undefined'));
            }
            
            if (!grandchild1_1 || !grandchild1_1.data || grandchild1_1.data.sequence !== '1.1') {
                success = false;
                messages.push('Grandchild1_1 sequence incorrect: ' + (grandchild1_1 && grandchild1_1.data ? grandchild1_1.data.sequence : 'undefined'));
            }
            
            addResult('Simple Sequencing', success, success ? 'All sequences correct' : messages.join('; '));
            return success;
        }

        // Test 3: Complex positioning method
        function testComplexPositioning() {
            log('=== Testing Complex Positioning ===');
            
            function getNodePosition(node) {
                var view = jm.view;
                var nodeElement = view.get_element(node.id);
                
                if (!nodeElement) {
                    log('No element found for node ' + node.id);
                    return null;
                }

                try {
                    var nodeRect = nodeElement.getBoundingClientRect();
                    var nodeCenterX = nodeRect.left + nodeRect.width / 2;
                    var nodeCenterY = nodeRect.top + nodeRect.height / 2;

                    var parentNode = node.parent ? jm.get_node(node.parent) : null;
                    var parentCenterX, parentCenterY;

                    if (parentNode) {
                        var parentElement = view.get_element(parentNode.id);
                        if (parentElement) {
                            var parentRect = parentElement.getBoundingClientRect();
                            parentCenterX = parentRect.left + parentRect.width / 2;
                            parentCenterY = parentRect.top + parentRect.height / 2;
                        } else {
                            return null;
                        }
                    } else {
                        var container = document.getElementById('jsmind_container');
                        var containerRect = container.getBoundingClientRect();
                        parentCenterX = containerRect.left + containerRect.width / 2;
                        parentCenterY = containerRect.top + containerRect.height / 2;
                    }

                    var deltaX = nodeCenterX - parentCenterX;
                    var deltaY = nodeCenterY - parentCenterY;
                    var angle = Math.atan2(deltaY, deltaX) * (180 / Math.PI);
                    if (angle < 0) angle += 360;

                    log('Node "' + node.topic + '" at angle ' + angle.toFixed(1) + '°');
                    return { x: deltaX, y: deltaY, angle: angle };
                } catch (e) {
                    log('Error getting position for ' + node.topic + ': ' + e.message);
                    return null;
                }
            }

            var positions = [];
            var rootNode = jm.get_node('root');
            
            if (rootNode && rootNode.children) {
                for (var i = 0; i < rootNode.children.length; i++) {
                    var childId = rootNode.children[i];
                    var childNode = jm.get_node(childId);
                    if (childNode) {
                        var position = getNodePosition(childNode);
                        positions.push({ node: childNode, position: position });
                    }
                }
            }

            var success = positions.length > 0 && positions.every(p => p.position !== null);
            addResult('Complex Positioning', success, 
                success ? positions.length + ' positions calculated' : 'Failed to calculate positions');
            
            return success;
        }

        // Test 4: Data persistence
        function testDataPersistence() {
            log('=== Testing Data Persistence ===');
            
            var testNode = jm.get_node('child1');
            if (!testNode) {
                addResult('Data Persistence', false, 'Test node not found');
                return false;
            }

            // Set test data
            if (!testNode.data) testNode.data = {};
            testNode.data.test_value = 'test123';
            testNode.data.sequence = '999';
            
            // Retrieve and verify
            var retrieved = jm.get_node('child1');
            var success = retrieved && retrieved.data && 
                         retrieved.data.test_value === 'test123' && 
                         retrieved.data.sequence === '999';
            
            addResult('Data Persistence', success, 
                success ? 'Data persisted correctly' : 'Data not persisted: ' + JSON.stringify(retrieved.data));
            
            return success;
        }

        // Complete diagnostic test
        function runCompleteTest() {
            clearResults();
            log('=== STARTING COMPLETE DIAGNOSTIC ===');
            
            setTimeout(function() {
                var test1 = testNodeStructure();
                var test2 = testSimpleSequencing();
                
                setTimeout(function() {
                    var test3 = testComplexPositioning();
                    var test4 = testDataPersistence();
                    
                    log('=== DIAGNOSTIC COMPLETE ===');
                    var overallSuccess = test1 && test2 && test3 && test4;
                    addResult('Overall', overallSuccess, 
                        overallSuccess ? 'All tests passed!' : 'Some tests failed - see details above');
                }, 200); // Wait for layout
            }, 100);
        }

        function testSimpleMethod() {
            clearResults();
            testSimpleSequencing();
        }

        function testComplexMethod() {
            clearResults();
            setTimeout(() => testComplexPositioning(), 100);
        }

        function addTestNode() {
            var newId = 'test_' + Date.now();
            jm.add_node('root', newId, 'Test Node');
            log('Added test node: ' + newId);
        }

        function showMetadata() {
            var allData = jm.get_data();
            if (allData && allData.data) {
                log('=== Current Node Metadata ===');
                for (var i = 0; i < allData.data.length; i++) {
                    var nodeData = allData.data[i];
                    var node = jm.get_node(nodeData.id);
                    if (node) {
                        log('Node "' + node.topic + '" (ID: ' + node.id + '):');
                        log('  Data: ' + JSON.stringify(node.data || {}));
                        log('  Parent: ' + (node.parent || 'none'));
                        log('  Children: ' + (node.children ? node.children.join(', ') : 'none'));
                    }
                }
            }
        }

        window.onload = function() {
            initMindMap();
            setTimeout(runCompleteTest, 1000);
        };
    </script>
</body>
</html>
